<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 186" width="880" height="186" role="img" aria-label="Emanuel Ferreira aka HOLMES_">
  <defs>
    <pattern id="halftone-banner" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.6" fill="#f1f1f6" fill-opacity="0.08" />
    </pattern>
  </defs>

  <style>
    .h-cursor {
      animation: cursor-blink 1.1s steps(1, end) infinite;
    }
    .status-dot {
      animation: status-pulse 2s ease-in-out infinite;
    }
    .glitch-r {
      animation: brand-glitch-r 6s steps(1, end) infinite;
    }
    .glitch-c {
      animation: brand-glitch-c 6s steps(1, end) infinite;
    }
    .ef-core {
      animation: brand-core-snap 6s steps(1, end) infinite;
    }
    .shadow-c {
      animation: brand-plate-c 6s steps(1, end) infinite;
    }
    .shadow-r {
      animation: brand-plate-r 6s steps(1, end) infinite;
    }

    @keyframes cursor-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes status-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes brand-glitch-r {
      0%, 82%, 100% { transform: translate(-11px, 8px); }
      84% { transform: translate(-38px, -4px); }
      87% { transform: translate(14px, 22px); }
      90% { transform: translate(-28px, 16px); }
      93% { transform: translate(-6px, -10px); }
      96% { transform: translate(-18px, 9px); }
    }
    @keyframes brand-glitch-c {
      0%, 82%, 100% { transform: translate(11px, -8px); }
      84% { transform: translate(38px, 4px); }
      87% { transform: translate(-14px, -22px); }
      90% { transform: translate(28px, -16px); }
      93% { transform: translate(6px, 10px); }
      96% { transform: translate(18px, -9px); }
    }
    @keyframes brand-core-snap {
      0%, 82%, 100% { transform: translate(0, 0); }
      85% { transform: translate(6px, -4px); }
      89% { transform: translate(-6px, 4px); }
      94% { transform: translate(4px, 2px); }
    }
    @keyframes brand-plate-c {
      0%, 82%, 100% { transform: translate(0, 0); }
      85% { transform: translate(5px, 4px); }
      91% { transform: translate(-3px, 5px); }
    }
    @keyframes brand-plate-r {
      0%, 82%, 100% { transform: translate(0, 0); }
      85% { transform: translate(-5px, -3px); }
      91% { transform: translate(4px, -4px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .h-cursor,
      .status-dot,
      .glitch-r,
      .glitch-c,
      .ef-core,
      .shadow-c,
      .shadow-r {
        animation: none !important;
      }
    }
  </style>

  <!-- Spider-Verse Chromatic Hard Shadows -->
  <rect class="shadow-c" x="16" y="16" width="854" height="160" fill="#00e5ff" />
  <rect class="shadow-r" x="10" y="10" width="854" height="160" fill="#ff0033" />

  <!-- Main Dark Editorial Panel -->
  <rect x="4" y="4" width="854" height="160" fill="#090d16" stroke="#4a4a60" stroke-width="3" />
  <rect x="6" y="6" width="850" height="156" fill="url(#halftone-banner)" />

  <!-- Discreet Spider-Web in top-right corner -->
  <g stroke="#00e5ff" stroke-opacity="0.22" stroke-width="1.3" fill="none">
    <path d="M858 4 L750 4 M858 4 L762 48 M858 4 L792 86 M858 4 L832 108 M858 4 L858 112" />
    <path d="M826 4 Q824 20 829 24 Q838 28 846 38 Q852 42 858 42" />
    <path d="M792 4 Q792 26 800 34 Q814 44 826 60 Q842 68 858 72" />
    <path d="M758 4 Q762 36 774 48 Q794 64 812 86 Q834 96 858 102" />
  </g>

  <!-- Status Pill Top-Right -->
  <g transform="translate(678, 22)">
    <rect x="0" y="0" width="156" height="24" fill="#101626" stroke="#4a4a60" stroke-width="1.5" />
    <circle class="status-dot" cx="14" cy="12" r="3.8" fill="#6ee7b7" />
    <text x="26" y="16" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="0.6">SYS // EARTH-1610</text>
  </g>

  <!-- EF + H_ Monogram -->
  <g transform="translate(26, 28) scale(0.22)">
    <g class="glitch-r" fill="#ff0033" transform="translate(-11, 8)">
      <rect x="86" y="130" width="46" height="218" />
      <rect x="132" y="130" width="86" height="40" />
      <rect x="132" y="218" width="72" height="38" />
      <rect x="132" y="308" width="86" height="40" />
      <rect x="252" y="130" width="46" height="218" />
      <rect x="298" y="130" width="86" height="40" />
      <rect x="298" y="218" width="66" height="38" />
    </g>
    <g class="glitch-c" fill="#00e5ff" transform="translate(11, -8)">
      <rect x="86" y="130" width="46" height="218" />
      <rect x="132" y="130" width="86" height="40" />
      <rect x="132" y="218" width="72" height="38" />
      <rect x="132" y="308" width="86" height="40" />
      <rect x="252" y="130" width="46" height="218" />
      <rect x="298" y="130" width="86" height="40" />
      <rect x="298" y="218" width="66" height="38" />
    </g>
    <g class="ef-core" fill="#f1f1f6">
      <rect x="86" y="130" width="46" height="218" />
      <rect x="132" y="130" width="86" height="40" />
      <rect x="132" y="218" width="72" height="38" />
      <rect x="132" y="308" width="86" height="40" />
      <rect x="252" y="130" width="46" height="218" />
      <rect x="298" y="130" width="86" height="40" />
      <rect x="298" y="218" width="66" height="38" />
    </g>
    <g transform="translate(316, 286)">
      <g fill="#00e5ff" transform="translate(3, -3)" opacity="0.7">
        <rect x="0" y="0" width="12" height="62" />
        <rect x="34" y="0" width="12" height="62" />
        <rect x="12" y="24" width="22" height="12" />
        <rect class="h-cursor" x="54" y="50" width="24" height="12" />
      </g>
      <g fill="#6ee7b7">
        <rect x="0" y="0" width="12" height="62" />
        <rect x="34" y="0" width="12" height="62" />
        <rect x="12" y="24" width="22" height="12" />
        <rect class="h-cursor" x="54" y="50" width="24" height="12" />
      </g>
    </g>
  </g>

  <!-- Identity & Positioning -->
  <text x="160" y="64" fill="#f1f1f6" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="27" font-weight="800" letter-spacing="1">EMANUEL FERREIRA</text>
  <text x="452" y="64" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="17" font-weight="600">aka</text>
  <text x="494" y="64" fill="#e62429" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="800" letter-spacing="1">HOLMES</text>
  <rect class="h-cursor" x="590" y="61" width="14" height="4" fill="#6ee7b7" />

  <text x="160" y="96" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14.5" font-weight="700">Construo sistemas backend, automação e IA aplicada em produção</text>

  <rect x="160" y="112" width="674" height="1.5" fill="#4a4a60" opacity="0.7" />

  <!-- Axis Tags inside Banner (centered in each box) -->
  <g transform="translate(160, 124)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700">
    <rect x="0" y="0" width="252" height="22" fill="#e62429" />
    <text x="126" y="15" text-anchor="middle" fill="#ffffff">ENG. DE SOFTWARE · UCSAL · 2028</text>

    <rect x="264" y="0" width="152" height="22" fill="#101626" stroke="#00e5ff" stroke-width="1" />
    <text x="340" y="15" text-anchor="middle" fill="#00e5ff">RAG &amp; IA APLICADA</text>

    <rect x="428" y="0" width="96" height="22" fill="#101626" stroke="#6ee7b7" stroke-width="1" />
    <text x="476" y="15" text-anchor="middle" fill="#6ee7b7">DEVSECOPS</text>

    <rect x="536" y="0" width="138" height="22" fill="#101626" stroke="#94a3b8" stroke-width="1" />
    <text x="605" y="15" text-anchor="middle" fill="#f1f1f6">DADOS &amp; AUTOMAÇÃO</text>
  </g>
</svg>
