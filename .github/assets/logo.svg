<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Emanuel Ferreira aka HOLMES_">
  <defs>
    <pattern id="halftone-b" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="2.2" fill="#f1f1f6" fill-opacity="0.13" />
    </pattern>
  </defs>

  <style>
    .h-cursor {
      animation: cursor-blink 1.1s steps(1, end) infinite;
    }

    .glitch-r {
      animation: brand-glitch-r 6s steps(1, end) infinite;
    }

    .glitch-c {
      animation: brand-glitch-c 6s steps(1, end) infinite;
    }

    .ef-core {
      animation: brand-core-snap 6s steps(1, end) infinite;
    }

    .shadow-c {
      animation: brand-plate-c 6s steps(1, end) infinite;
    }

    .shadow-r {
      animation: brand-plate-r 6s steps(1, end) infinite;
    }

    @keyframes cursor-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes brand-glitch-r {
      0%, 82%, 100% { transform: translate(-11px, 8px); }
      84% { transform: translate(-22px, 3px); }
      87% { transform: translate(-4px, 15px); }
      90% { transform: translate(-18px, 12px); }
      93% { transform: translate(-7px, 2px); }
      96% { transform: translate(-16px, 9px); }
    }

    @keyframes brand-glitch-c {
      0%, 82%, 100% { transform: translate(11px, -8px); }
      84% { transform: translate(23px, -3px); }
      87% { transform: translate(4px, -16px); }
      90% { transform: translate(17px, -12px); }
      93% { transform: translate(6px, -2px); }
      96% { transform: translate(15px, -9px); }
    }

    @keyframes brand-core-snap {
      0%, 82%, 100% { transform: translate(0, 0); }
      85% { transform: translate(3px, -2px); }
      89% { transform: translate(-3px, 2px); }
      94% { transform: translate(2px, 1px); }
    }

    @keyframes brand-plate-c {
      0%, 82%, 100% { transform: translate(0, 0); }
      85% { transform: translate(6px, 4px); }
      91% { transform: translate(-3px, 6px); }
    }

    @keyframes brand-plate-r {
      0%, 82%, 100% { transform: translate(0, 0); }
      85% { transform: translate(-5px, -3px); }
      91% { transform: translate(4px, -4px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .h-cursor,
      .glitch-r,
      .glitch-c,
      .ef-core,
      .shadow-c,
      .shadow-r {
        animation: none !important;
      }
    }
  </style>

  <!-- Spider-Verse Chromatic Hard Shadows -->
  <rect class="shadow-c" x="48" y="48" width="432" height="432" fill="#00e5ff" />
  <rect class="shadow-r" x="34" y="34" width="432" height="432" fill="#ff0033" />

  <!-- Main Miles Morales dark square -->
  <rect x="20" y="20" width="432" height="432" fill="#090d16" stroke="#4a4a60" stroke-width="14" />
  <rect x="27" y="27" width="418" height="418" fill="url(#halftone-b)" />

  <!-- Glitch Layer: Red (-11, +8) -->
  <g class="glitch-r" fill="#ff0033" transform="translate(-11, 8)">
    <rect x="86" y="130" width="46" height="218" />
    <rect x="132" y="130" width="86" height="40" />
    <rect x="132" y="218" width="72" height="38" />
    <rect x="132" y="308" width="86" height="40" />

    <rect x="252" y="130" width="46" height="218" />
    <rect x="298" y="130" width="86" height="40" />
    <rect x="298" y="218" width="66" height="38" />
  </g>

  <!-- Glitch Layer: Cyan (+11, -8) -->
  <g class="glitch-c" fill="#00e5ff" transform="translate(11, -8)">
    <rect x="86" y="130" width="46" height="218" />
    <rect x="132" y="130" width="86" height="40" />
    <rect x="132" y="218" width="72" height="38" />
    <rect x="132" y="308" width="86" height="40" />

    <rect x="252" y="130" width="46" height="218" />
    <rect x="298" y="130" width="86" height="40" />
    <rect x="298" y="218" width="66" height="38" />
  </g>

  <!-- Crisp White EF Monogram (solid, no horizontal cuts) -->
  <g class="ef-core" fill="#f1f1f6">
    <rect x="86" y="130" width="46" height="218" />
    <rect x="132" y="130" width="86" height="40" />
    <rect x="132" y="218" width="72" height="38" />
    <rect x="132" y="308" width="86" height="40" />

    <rect x="252" y="130" width="46" height="218" />
    <rect x="298" y="130" width="86" height="40" />
    <rect x="298" y="218" width="66" height="38" />
  </g>

  <!-- Discreet H_ signature tucked under the right arm of F -->
  <g transform="translate(316, 286)">
    <g fill="#00e5ff" transform="translate(3, -3)" opacity="0.7">
      <rect x="0" y="0" width="12" height="62" />
      <rect x="34" y="0" width="12" height="62" />
      <rect x="12" y="24" width="22" height="12" />
      <rect class="h-cursor" x="54" y="50" width="24" height="12" />
    </g>
    <g fill="#6ee7b7">
      <rect x="0" y="0" width="12" height="62" />
      <rect x="34" y="0" width="12" height="62" />
      <rect x="12" y="24" width="22" height="12" />
      <rect class="h-cursor" x="54" y="50" width="24" height="12" />
    </g>
  </g>
</svg>
